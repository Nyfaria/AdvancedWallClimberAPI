plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.loom.loader)
    alias(nyfs.plugins.regutils.loader)
    id("com.nyfaria.moddingtools.dependencies")
    id("com.nyfaria.moddingtools.publishing")
    id 'multiloader-fabric'
    id 'dev._100media.gradleutils' version '1.+'
    id 'maven-publish'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = "${mod_id}-fabric"
            version = "${project.version}+${minecraft_version}"

            afterEvaluate {
                artifact tasks.named("jar")
            }

            pom {
                name = "${mod_name} (Fabric)"
                description = project.description ?: 'An API for advanced wall climbing mechanics.'
                url = 'https://github.com/Nyfaria/AdvancedWallClimberAPI'

                licenses {
                    license {
                        name = 'All Rights Reserved'
                        url = 'https://github.com/Nyfaria/AdvancedWallClimberAPI'
                    }
                }

                developers {
                    developer {
                        id = 'nyfaria'
                        name = 'Nyfaria'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/Nyfaria/AdvancedWallClimberAPI.git'
                    developerConnection = 'scm:git:ssh://github.com/Nyfaria/AdvancedWallClimberAPI.git'
                    url = 'https://github.com/Nyfaria/AdvancedWallClimberAPI'
                }
            }
        }
    }

    repositories {
        maven(hundredMedia.getPublishing100MediaMaven())
    }
}
